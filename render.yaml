services:
  - type: web
    name: ledgerly-bank
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render makes a random key
